name: Build Tanishtra Mobile APK
on:
  workflow_dispatch:
  push:
    branches: [mobile-carousel-android]
    paths:
      - 'tanishtra-mobile/**'
      - '.github/workflows/tanishtra-mobile-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tanishtra-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Tanishtra-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tanishtra-Android-APK
          path: tanishtra-mobile/Tanishtra-debug.apk
          if-no-files-found: error
