name: Build TANISHTRA APK
on:
  workflow_dispatch:
  push:
    branches: [android-apk]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK and required packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            test -n "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p android :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TANISHTRA-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TANISHTRA-APK
          path: TANISHTRA-debug.apk
