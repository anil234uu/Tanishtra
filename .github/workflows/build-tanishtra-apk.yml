name: Build TANISHTRA APK
on:
  workflow_dispatch:
  push:
    branches: [android-apk]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p android :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TANISHTRA-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TANISHTRA-APK
          path: TANISHTRA-debug.apk
